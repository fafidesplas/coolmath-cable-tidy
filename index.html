<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1d2433" />
    <meta name="description" content="Cable Calm: a relaxing cable-tidying job simulator. Untangle, plug in, tie and admire." />
    <title>Cable Calm — Tidy Tech Jobs</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231d2433'/%3E%3Cpath d='M12 18c20 0 10 28 40 28' stroke='%230060a8' stroke-width='7' fill='none' stroke-linecap='round'/%3E%3Cpath d='M12 30c18 0 14 16 40 16' stroke='%23f5dd1e' stroke-width='7' fill='none' stroke-linecap='round'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="app">
      <header id="hud">
        <button id="btn-menu" class="icon" aria-label="Menu">
          <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16" /></svg>
        </button>
        <div class="hud-title">
          <div id="lvl-name">Cable Calm</div>
          <div id="lvl-sub"></div>
        </div>
        <div class="hud-stats">
          <div id="conn" title="Working connections">0/0</div>
          <div class="meter" title="Tidiness"><div id="meter-fill"></div></div>
        </div>
        <button id="btn-sound" class="icon" aria-label="Sound"></button>
      </header>
      <div id="tasks"></div>
      <main id="stage">
        <canvas id="cv"></canvas>
        <div id="flash"></div>
        <div id="hint"></div>
        <div id="toast"></div>
      </main>
      <footer id="toolbar">
        <div id="tray" role="toolbar" aria-label="Tools"></div>
        <div id="actions">
          <button id="btn-reset" class="tool" aria-label="Reset job">
            <svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v5h5" /></svg>
          </button>
          <button id="btn-finish" class="tool primary" disabled>
            <svg viewBox="0 0 24 24"><path d="M12 3v9M6.3 7.5a8 8 0 1 0 11.4 0" /></svg><span>Power on</span>
          </button>
        </div>
      </footer>
      <div id="overlay"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
